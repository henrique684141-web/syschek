<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central de Segurança</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020402;color:#00ff66;font-family:Consolas,monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.28}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
.box{width:min(760px,94%);border:1px solid #00ff66;background:rgba(0,8,0,.9);padding:30px;box-shadow:0 0 35px rgba(0,255,102,.18)}
h1{font-size:25px;margin:0 0 18px}
#status{min-height:28px}
.bar{height:20px;border:1px solid #00ff66;margin:22px 0 8px}
.fill{height:100%;width:0;background:#00ff66;box-shadow:0 0 12px #00ff66}
#percent{text-align:right}
.small{opacity:.75;font-size:13px;margin-top:18px}
.final{text-align:center;font-size:30px}
.final p{font-size:15px}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="overlay">
  <div class="box" id="box">
    <h1>⚠ CENTRAL DE SEGURANÇA ⚠</h1>
    <div id="status">Iniciando diagnóstico...</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div id="percent">0%</div>
    <div class="small" id="detail">Estabelecendo conexão segura...</div>
  </div>
</div>
<script>
/* Efeito visual de "código descendo" — não acessa nem envia dados. */
const canvas=document.getElementById("matrix"),ctx=canvas.getContext("2d");
let font=14, cols,drops;
function resize(){
  canvas.width=innerWidth; canvas.height=innerHeight;
  cols=Math.floor(canvas.width/font); drops=Array(cols).fill(1).map(()=>Math.random()*-30);
}
resize(); addEventListener("resize",resize);
const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*+<>/{}[]";
setInterval(()=>{
  ctx.fillStyle="rgba(0,4,0,.09)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff66";ctx.font=font+"px Consolas";
  for(let i=0;i<drops.length;i++){
    const c=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(c,i*font,drops[i]*font);
    if(drops[i]*font>canvas.height && Math.random()>.975)drops[i]=0;
    drops[i]+=.72;
  }
},45);

let start=performance.now(), duration=10000;
const statuses=[
  [0,"Iniciando diagnóstico...","Estabelecendo conexão segura..."],
  [18,"Verificando protocolos...","Analisando camadas de segurança..."],
  [36,"Processando criptografia...","Validando chaves de acesso..."],
  [55,"Analisando sistema...","Executando verificação profunda..."],
  [73,"Quase terminando...","Finalizando análise..."],
  [90,"Concluindo operação...","Preparando relatório..."]
];
function tick(now){
  let p=Math.min(100,((now-start)/duration)*100);
  document.getElementById("fill").style.width=p+"%";
  document.getElementById("percent").textContent=Math.floor(p)+"%";
  let s=statuses[0];
  for(const item of statuses) if(p>=item[0]) s=item;
  document.getElementById("status").textContent=s[1];
  document.getElementById("detail").textContent=s[2];
  if(p<100) requestAnimationFrame(tick);
  else setTimeout(()=>{
    document.getElementById("box").innerHTML=
      '<div class="final"><div style="font-size:70px">😂</div><b>VOCÊ CAIU NA PEGADINHA!</b><p>Nenhum dado foi acessado ou coletado.</p></div>';
  },700);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
